# Pipeline compute — separate from the app.
# Requires the data plane network: start data compose first.
#
# Today extract runs on the host:
#   uv run --package pipeline python -m pipeline.flows.ingest
# with DB/Qdrant/Ollama on localhost (ports published by data compose).
#
# Usage (when worker image exists):
#   docker compose -f infra/docker-compose.data.yml --env-file .env up -d
#   docker compose -f infra/docker-compose.pipeline.yml --env-file .env --profile worker up -d
#
# Inside this network use hostnames: db, qdrant, ollama
#   DB_HOST=db
#   QDRANT_HOST=qdrant
#   OLLAMA_BASE_URL=http://ollama:11434/v1

name: skillpolaris-pipeline

networks:
  skillpolaris:
    external: true
    name: skillpolaris

services:
  # Future: containerized Prefect / pipeline worker.
  # Kept behind profile so this file is valid without building yet.
  pipeline-worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: apps/pipeline/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OLLAMA_BASE_URL: http://ollama:11434/v1
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      MAX_TOTAL_DETAILS: ${MAX_TOTAL_DETAILS:-50}
      MAX_DEPTH: ${MAX_DEPTH:-3}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-job_offers}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
    networks:
      - skillpolaris
    restart: unless-stopped
