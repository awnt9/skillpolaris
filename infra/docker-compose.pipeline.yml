# Prefect server + pipeline worker (full Docker / prod-like).
# Requires the data plane network: start data compose first.
#
# Usage:
#   make compose ARGS="up -d"
#   make compose-pipeline ARGS="up -d --build"
#
# UI: PREFECT_UI_API_URL in .env (browser URL)
# Debug:
#   docker compose -f infra/docker-compose.pipeline.yml --env-file .env exec pipeline-worker bash
#   make pipeline-shell

name: skillpolaris-pipeline

networks:
  skillpolaris:
    external: true
    name: skillpolaris

volumes:
  prefect_data:

services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: skillpolaris_prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    env_file:
      - ../.env
    environment:
      # Listen on all interfaces inside the container (not a user secret).
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "${PREFECT_PORT}:4200"
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - skillpolaris
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  pipeline-worker:
    build:
      context: ..
      dockerfile: apps/pipeline/Dockerfile
    container_name: skillpolaris_pipeline_worker
    env_file:
      - ../.env
    networks:
      - skillpolaris
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
