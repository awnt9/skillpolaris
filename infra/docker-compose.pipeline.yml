# Prefect server + pipeline worker (full Docker / prod-like).
# Requires the data plane network (created by docker-compose.data.yml).
#
# Preferred: make up
# Or:
#   make compose ARGS="up -d --wait"
#   make compose-pipeline ARGS="up -d --build"
#
# Worker entrypoint runs alembic upgrade before starting.
# UI: http://127.0.0.1:${PREFECT_PORT}
# Debug: make pipeline-shell

name: skillpolaris-pipeline

networks:
  skillpolaris:
    external: true
    name: skillpolaris

volumes:
  prefect_data:

services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: skillpolaris_prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    env_file:
      - ../.env
    environment:
      # Listen on all interfaces inside the container (not a user secret).
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "${PREFECT_PORT}:4200"
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - skillpolaris
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  pipeline-worker:
    build:
      context: ..
      dockerfile: apps/pipeline/Dockerfile
    container_name: skillpolaris_pipeline_worker
    env_file:
      - ../.env
    networks:
      - skillpolaris
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
