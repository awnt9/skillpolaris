# Prefect server + pipeline worker (full Docker / prod-like).
# Requires the data plane network (created by docker-compose.data.yml).
#
# Local build only — pipeline-worker builds from apps/pipeline/Dockerfile.
#
# make up-pipeline        / just up-pipeline        -> pipeline only (data must already be up)
# make up-pipeline FULL=1 / just up-pipeline --full  -> data + pipeline
#
# Worker entrypoint runs alembic upgrade before starting.
# UI: http://127.0.0.1:${PREFECT_PORT}
# Debug: docker compose -f infra/docker-compose.pipeline.yml --env-file .env exec pipeline-worker bash

name: ${COMPOSE_PROJECT_NAME:-skillpolaris}-pipeline

networks:
  skillpolaris:
    external: true
    name: ${COMPOSE_NETWORK_NAME:-skillpolaris}

volumes:
  prefect_data:

services:
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: ${PREFECT_CONTAINER_NAME:-prefect}
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    env_file:
      - ../.env
    environment:
      # Listen on all interfaces inside the container (not a user secret).
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "${PREFECT_PORT}:4200"
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - skillpolaris
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  pipeline-worker:
    build:
      context: ..
      dockerfile: apps/pipeline/Dockerfile
    container_name: ${PIPELINE_WORKER_CONTAINER_NAME:-pipeline_worker}
    env_file:
      - ../.env
    networks:
      - skillpolaris
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
