# Self-hosted Langfuse — LLM observability for the filter/enrich agents.
# Requires the data plane network: start data compose first.
#
# make up-langfuse        / just up-langfuse        -> langfuse only (data must already be up)
# make up-langfuse FULL=1 / just up-langfuse --full  -> data + langfuse
#
# UI: http://127.0.0.1:${LANGFUSE_PORT:-3001}
# pipeline-worker reaches it internally at http://langfuse-web:3000/api/public/otel
# (see LANGFUSE_OTEL_ENDPOINT / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY in .env —
# the org/project/user/API keys below are auto-provisioned on first boot, no
# manual UI setup needed).

name: ${COMPOSE_PROJECT_NAME:-skillpolaris}-langfuse

networks:
  skillpolaris:
    external: true
    name: ${COMPOSE_NETWORK_NAME:-skillpolaris}

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:

services:
  langfuse-postgres:
    image: postgres:17-alpine
    container_name: ${LANGFUSE_POSTGRES_CONTAINER_NAME:-langfuse_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - skillpolaris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: ${LANGFUSE_CLICKHOUSE_CONTAINER_NAME:-langfuse_clickhouse}
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    networks:
      - skillpolaris
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-redis:
    image: redis:7-alpine
    container_name: ${LANGFUSE_REDIS_CONTAINER_NAME:-langfuse_redis}
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_REDIS_AUTH} --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    networks:
      - skillpolaris
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio:latest
    container_name: ${LANGFUSE_MINIO_CONTAINER_NAME:-langfuse_minio}
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse_minio_data:/data
    networks:
      - skillpolaris
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: ${LANGFUSE_WORKER_CONTAINER_NAME:-langfuse_worker}
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment: &langfuse-shared-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}
      REDIS_TLS_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    networks:
      - skillpolaris

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: ${LANGFUSE_WEB_CONTAINER_NAME:-langfuse_web}
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      <<: *langfuse-shared-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # Auto-provision org/project/user/API keys on first boot so pipeline-worker
      # can start sending traces immediately — no manual UI setup required.
      LANGFUSE_INIT_ORG_ID: skillpolaris
      LANGFUSE_INIT_ORG_NAME: SkillPolaris
      LANGFUSE_INIT_PROJECT_ID: skillpolaris-pipeline
      LANGFUSE_INIT_PROJECT_NAME: pipeline
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    networks:
      - skillpolaris
