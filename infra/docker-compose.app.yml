# Application compute — frontend + backend, separate from the pipeline.
# Requires the data plane network: start data compose first.
#
# Local build only — api/web build from apps/api/Dockerfile and
# apps/web/Dockerfile.
#
# make up-app        / just up-app        -> app only (data must already be up)
# make up-app FULL=1 / just up-app --full -> data + app

name: skillpolaris-app

networks:
  skillpolaris:
    external: true
    name: skillpolaris

services:
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${API_PORT}:8000"
    networks:
      - skillpolaris
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${WEB_PORT}:3000"
    networks:
      - skillpolaris
    restart: unless-stopped
    depends_on:
      - api
