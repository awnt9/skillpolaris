# Application compute — frontend + backend, separate from the pipeline.
# Requires the data plane network: start data compose first.
#
# Local build only — api/web build from apps/api/Dockerfile and
# apps/web/Dockerfile. Neither exists in this repo yet, so this plane
# doesn't run until they're added.
#
# Usage (once Dockerfiles exist):
#   make compose ARGS="up -d"
#   make compose-app ARGS="--profile app up -d"

name: skillpolaris-app

networks:
  skillpolaris:
    external: true
    name: skillpolaris

services:
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${API_PORT}:8000"
    networks:
      - skillpolaris
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${WEB_PORT}:3000"
    networks:
      - skillpolaris
    restart: unless-stopped
    depends_on:
      - api
