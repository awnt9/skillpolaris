# Application compute — frontend + backend, separate from the pipeline.
# Requires the data plane network: start data compose first.
#
# Usage (when images exist):
#   make compose ARGS="up -d"
#   make compose-app ARGS="--profile app up -d"

name: skillpolaris-app

networks:
  skillpolaris:
    external: true
    name: skillpolaris

services:
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    networks:
      - skillpolaris
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    networks:
      - skillpolaris
    restart: unless-stopped
    depends_on:
      - api
