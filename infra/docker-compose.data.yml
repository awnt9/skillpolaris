# Shared data plane — keep up while developing pipeline or app.
# Usage:
#   make compose ARGS="up -d"

name: skillpolaris-data

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - ../.env
    environment:
      # Compose interpolation for healthcheck/volume still uses --env-file on the CLI.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ${DB_PATH}:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - skillpolaris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../qdrant_data:/qdrant/storage
    networks:
      - skillpolaris

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ../ollama_data:/root/.ollama
    networks:
      - skillpolaris

networks:
  skillpolaris:
    name: skillpolaris
    driver: bridge
