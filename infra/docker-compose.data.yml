# Shared data plane — keep up while developing pipeline or app.
# Usage:
#   make compose ARGS="up -d"

name: skillpolaris-data

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - ../.env
    environment:
      # Compose interpolation for healthcheck/volume still uses --env-file on the CLI.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ${DB_PATH}:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - skillpolaris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pgweb
    restart: always
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skillpolaris

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ../ollama_data:/root/.ollama
    networks:
      - skillpolaris

networks:
  skillpolaris:
    name: skillpolaris
    driver: bridge
