[project]
name = "pipeline"
version = "0.1.0"
description = "SkillPolaris ETL pipeline (extract, filter, enrich)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "dotenv>=0.9.9",
    "openai>=2.31.0",
    "prefect>=3.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-ai>=2.8.0",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/pipeline/tasks/enrich/prompt.md" = "pipeline/tasks/enrich/prompt.md"
