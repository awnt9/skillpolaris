[project]
name = "pipeline"
version = "0.1.0"
description = "SkillPolaris ETL pipeline (extract, transform, embed, load)"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "instructor>=1.15.1",
    "openai>=2.31.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "qdrant-client>=1.17.1",
    "requests>=2.32.5",
    "rich>=14.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
