# Alembic config for the pipeline package.
# Run from repo root:
#   uv run --package pipeline alembic -c apps/pipeline/alembic.ini upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is set in env.py from pipeline Settings / .env
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
